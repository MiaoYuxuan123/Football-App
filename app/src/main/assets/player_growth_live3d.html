<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>球员养成实时 3D</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #2c2c2c 0%, #101010 65%, #050505 100%);
      font-family: Arial, sans-serif;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    #hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      letter-spacing: 0.2px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 6px 9px;
      z-index: 2;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <iframe
      title="Soccer player 1114-4"
      allowfullscreen
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      xr-spatial-tracking
      execution-while-out-of-viewport
      execution-while-not-rendered
      web-share
      src="https://sketchfab.com/models/4cf0319e08a346e0812cea26afbf04c0/embed">
    </iframe>
    <div id="hint">已切换为 Sketchfab 在线模型，双指缩放/单指旋转</div>
  </div>
</body>
</html>
